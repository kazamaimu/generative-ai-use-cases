name: Auto Fetch Upstream

on:
  schedule:
    - cron: "0 9 * * 1"   # 毎週月曜9時（UTC）実行
  workflow_dispatch:      # 手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. GitHub Actions での認証設定
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 3. upstream リポジトリを追加
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/aws-samples/generative-ai-use-cases.git || true
          git remote set-url upstream https://github.com/aws-samples/generative-ai-use-cases.git

      # 4. upstream の更新を取得
      - name: Fetch upstream
        run: git fetch upstream

      # 5. upstream/main を自分の main にマージ
      - name: Merge upstream
        id: merge
        run: |
          git checkout main
          git merge upstream/main --no-edit 2>&1 || {
            echo "status=conflict" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "status=success" >> $GITHUB_OUTPUT

      # 6. マージ失敗時は Issue を作成
      - name: Create issue on conflict
        if: steps.merge.outputs.status == 'conflict'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Upstream merge conflict detected',
              body: `Merging upstream/main into main failed due to conflicts.\nPlease resolve manually: https://github.com/${context.repo.owner}/${context.repo.repo}/compare/main...upstream/main`,
              labels: ['upstream-sync', 'needs-review']
            })

      # 7. マージ成功時のみプッシュ
      - name: Push changes
        if: steps.merge.outputs.status == 'success'
        run: |
          git push origin main
          echo "✅ Successfully synced with upstream"

      # 8. 失敗通知（オプション）
      - name: Notify failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 1,
              body: '❌ Auto sync workflow failed. Please check the logs.'
            })
